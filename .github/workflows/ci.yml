name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run on a branch when a new push lands on the same
# branch. Keeps queue depth bounded — the last commit is the one we care about.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chefflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chefflow/package-lock.json
      - run: npm ci
      # Lint is currently non-blocking — 17 pre-existing errors are all
      # tolerated `react-hooks/set-state-in-effect` warnings in modal sheets
      # (LlmSettingsSheet, AccountSetupSheet, AccountDataSheet, HelpSheet,
      # …). Fix that backlog before flipping this to a gating step.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test:run
      - run: npm run build

  worker:
    name: Worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chefflow-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chefflow-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
