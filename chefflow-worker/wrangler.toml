name = "chefflow-llm-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-15"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6300f5a914fa4ea885b73ae1860d3a1e"

# Per-user sync database (recipes / events / menus / allergen audits).
# Schema lives in migrations/. Apply via `wrangler d1 migrations apply chefflow-sync --remote`.
[[d1_databases]]
binding = "DB"
database_name = "chefflow-sync"
database_id = "8f70e28a-3304-4f81-b83c-4bbc5fb537af"
migrations_dir = "migrations"

[vars]
CLERK_ISSUER = "https://engaging-bat-5.clerk.accounts.dev"
# Legacy LLM daily cap, superseded by per-tier maxLlmCallsPerDay in src/limits.ts.
DAILY_LIMIT = "30"
# T7 — CORS allow-list. Comma-separated; the worker echoes the request
# Origin if it matches one of these (or any localhost / *.chefflow
# .pages.dev preview). Read by parseAllowedOrigins() in src/index.ts.
ALLOWED_ORIGINS = "https://chefflow.uk"

# ---------------------------------------------------------------------------
# Secrets — set via `wrangler secret put <NAME>`. NEVER commit values here.
# Required for PR 4 (Stripe billing). Without them, /billing/* + /webhook/stripe
# routes will fail at runtime; the rest of the worker keeps working.
#
#   wrangler secret put CLERK_SECRET_KEY              # sk_live_… / sk_test_…
#   wrangler secret put STRIPE_SECRET_KEY             # sk_live_… / sk_test_…
#   wrangler secret put STRIPE_WEBHOOK_SECRET         # whsec_… from `stripe listen`
#   wrangler secret put STRIPE_PRICE_ID_PRO_MONTHLY   # price_… (£12/mo)
#   wrangler secret put STRIPE_PRICE_ID_PRO_ANNUAL    # price_… (£108/yr)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Cron triggers — see `scheduled()` in src/index.ts. Dispatch is keyed by
# the literal cron string so adding a new schedule means appending here
# AND adding a case branch in scheduled().
#
#   - "0 8 * * *"   — daily 08:00 UTC combined ops digest to
#                     admin@chefflow.uk: ONE email with two sections
#                     (LLM-summarised Gmail inbox + contact-form
#                     submissions). Replaces the prior split crons
#                     (gmail-digest at 07:30 + contact-digest at 08:00).
#                     Requires GOOGLE_OAUTH_* + RESEND_API_KEY worker
#                     secrets — gracefully renders placeholder
#                     sections when either side fails.
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 8 * * *"]
